<div class="admin-shell">
	<aside class="admin-sidebar" aria-label="Main navigation">
		<a class="sidebar-brand" href="/admin/client-list" aria-label="WareSpace workspace">
			<span class="sidebar-brand__mark" aria-hidden="true"><i class="fa fa-cubes"></i></span>
			<span class="sidebar-brand__name">WareSpace</span>
		</a>

		<div class="sidebar-section-label">WORKSPACE</div>
		<nav class="sidebar-nav">
			<a class="sidebar-link sidebar-link--active" href="/admin/client-list" aria-current="page">
				<i class="fa fa-users" aria-hidden="true"></i>
				<span>Clients</span>
			</a>
			<a class="sidebar-link" href="/admin/client-form">
				<i class="fa fa-plus-square-o" aria-hidden="true"></i>
				<span>Add client</span>
			</a>
		</nav>

		<div class="sidebar-account">
			<div class="account-summary">
				<div class="account-avatar" aria-hidden="true">AM</div>
				<div class="account-details">
					<span class="account-name">{{loggedUser.emailId}}</span>
					<span class="account-role">Warehouse owner</span>
				</div>
			</div>
			<button class="logoff-button" type="button" (click)="onLogOut()">
				<i class="fa fa-sign-out" aria-hidden="true"></i>
				<span>Log off</span>
			</button>
		</div>
	</aside>

	<div class="admin-main">
		<header class="admin-topbar">
			<button class="sidebar-toggle" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
				<i class="fa fa-bars" aria-hidden="true"></i>
			</button>
			<div class="topbar-heading">
				<span class="topbar-eyebrow">WARESPACE WORKSPACE</span>
				<span class="topbar-title">Warehouse operations</span>
			</div>
			<div class="topbar-status">
				<span class="topbar-status__dot" aria-hidden="true"></span>
				<span>Workspace active</span>
			</div>
		</header>

		<main class="admin-content" aria-label="Workspace content">
            <router-outlet />
        </main>
	</div>
</div>
